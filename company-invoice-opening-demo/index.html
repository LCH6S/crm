  if (mode === "rpa") return ["客户编号", "统一社会信用代码", "纳税人类型", "计税方式", "征收率（选填）", "地址（选填）", "电话（选填）", "开户行（选填）", "开户行账号（选填）", "开票人姓名", "税局登录手机号", "税局密码", "开票人身份", "联系邮箱（选填）"];
  return ["客户编号", "统一社会信用代码", "纳税人类型", "计税方式", "征收率（选填）", "地址（选填）", "电话（选填）", "开户行（选填）", "开户行账号（选填）"];
}

function renderInvoiceBatchOpening() {
  const batch = state.batchOpening;
  if (!batch || !["rpa", "joint", "self"].includes(batch.mode)) {
    state.view = "business-opening";
    state.workbenchSection = "matters";
    state.businessDomain = "invoice";
    state.batchOpening = null;
    return renderBusinessOpening();
  }
  const batchTitle = batchMatterName(batch.mode);
  const task = batchRuns.find(run => run.id === batch.batchId);
  let content = "";
  if (batch.step === 1) {
    const fields = batchTemplateFields(batch.mode).map((field) => `<span>${escapeHtml(field)}</span>`).join("");
    const fileCard = batch.fileName ? `<div class="batch-file-card"><div><strong>${escapeHtml(batch.fileName)}</strong><small>文件已上传，可开始检查</small></div><button class="button link danger" type="button" data-action="remove-batch-file">移除</button></div>` : "";
    const templateHint = `请下载${batchMatterName(batch.mode)}模板，并按模板填写同一客户下的公司信息。${batch.mode === "joint" ? "每行填写一个微信商户号。三项开票能力分别填写“开通”或留空，留空表示不申请该能力；至少填写一项“开通”。" : ""}`;
    content = `<div class="batch-upload-section"><h2>1. 下载模板</h2><p>${templateHint}</p><div class="batch-template-fields" aria-label="模板字段">${fields}</div><button class="button border" type="button" data-action="download-batch-template">下载模板</button></div><div class="batch-upload-section divider-top"><h2>2. 上传文件</h2><p>支持 xlsx 格式，文件大小不超过 5MB</p><button class="batch-upload-box" type="button" data-action="select-batch-file"><span class="upload-icon">⇧</span><strong>点击选择示例文件</strong><small>也可拖拽文件到此区域上传</small></button>${fileCard}<button class="button primary batch-primary-action" type="button" data-action="check-batch-opening" ${batch.fileName ? "" : "disabled"}>开始检查</button></div>`;
  } else if (batch.step === 2) {
    const total = batch.checkResults.length;
    const passed = batch.checkResults.filter((result) => result.passed).length;
    const failed = total - passed;
    content = `${task?.error ? `<div class="notice error">${escapeHtml(task.error)}</div>` : ""}<div class="batch-result-head"><div class="batch-stats"><span>总行数：<strong>${total}</strong></span><span class="success-text">通过：<strong>${passed}</strong></span><span class="danger-text">不通过：<strong>${failed}</strong></span></div><div><button class="button border" type="button" data-action="reupload-invoice-batch">重新上传</button><button class="button primary" type="button" data-action="submit-invoice-batch" ${passed && task?.status === "CheckCompleted" ? "" : "disabled"}>执行文件</button></div></div>${renderBatchCheckTable(batch)}`;
  } else {
    const rows = (batch.submitResults || []).map((result, index) => {
      const statusKey = result.status === "success" ? "success" : result.status === "failed" ? "failed" : "pending";
      return `<tr><td>${index + 1}</td>${renderBatchImportCells(batch.mode, batch.sourceRows[index])}<td>${statusMarkup(statusKey, result.label)}</td><td>${result.status === "success" ? "" : escapeHtml(result.reason || "")}</td></tr>`;
    }).join("");
    const successCount = batch.submitResults.filter((result) => result.status === "success").length;
    const failedCount = batch.submitResults.filter((result) => result.status === "failed").length;
    const skippedCount = batch.submitResults.filter((result) => result.status === "skipped").length;
    content = `${task?.error ? `<div class="notice error">${escapeHtml(task.error)}</div>` : ""}<div class="batch-result-summary"><div><span>创建成功</span><strong class="success-text">${successCount}</strong></div><div><span>创建失败</span><strong class="danger-text">${failedCount}</strong></div><div><span>跳过</span><strong>${skippedCount}</strong></div></div><div class="table-scroll"><table class="data-table batch-import-table"><thead><tr><th>行号</th>${renderBatchImportHead(batch.mode)}<th>执行结果</th><th>原因</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  app.innerHTML = `${breadcrumb([{ label: "业务办理工作台", action: "back-business-opening" }, { label: batchTitle }])}<div class="page-back-row"><button class="button border" type="button" data-action="cancel-invoice-batch">返回</button></div><section class="panel detail-summary batch-summary"><div class="detail-summary-main"><div class="detail-summary-title"><h1>${escapeHtml(batchTitle)}</h1></div></div></section>${renderBatchSteps(batch.step)}<section class="panel batch-workspace">${content}</section>`;

}

function renderChinaInvoiceSuccess(company) {
  const tax = company.tax;
  const invoiceReady = company.openStatus === "success";
  const availability = invoiceReady ? availabilityMarkup(company) : statusMarkup("pending", "未启用");
  const availabilityAction = invoiceReady
    ? `<span>${company.enabled ? "开票功能已启用" : "开票功能已禁用"}</span><button class="switch" type="button" role="switch" aria-label="开票功能状态" aria-checked="${company.enabled}" data-action="toggle-invoice"></button>`
    : '<span>开票功能将在当前模式开通成功后启用</span><button class="switch" type="button" role="switch" aria-label="开票功能状态" aria-checked="false" aria-disabled="true" disabled></button>';
  return `<div>
    <div class="invoice-summary-card">
      <div><h2>${escapeHtml(company.name)}</h2><div class="summary-line"><span>所属客户：${escapeHtml(company.customer)}（${escapeHtml(company.customerNo)}）</span><span>税号：${escapeHtml(company.registrationNo)}</span><span>当前使用模式：<strong>${escapeHtml(company.currentMode ? modeLabel(company.currentMode) : "-")}</strong></span><span>${availability}</span></div></div>
      <div class="invoice-summary-action">${availabilityAction}</div>
    </div>
    <div class="section-divider"></div>
    <div class="section-heading"><div><h2>基本信息</h2></div><button class="button border" type="button" data-action="edit-tax">编辑</button></div>
    <dl class="info-grid">
      <div><dt>纳税人名称</dt><dd>${escapeHtml(company.name)}</dd></div><div><dt>税号</dt><dd>${escapeHtml(company.registrationNo)}</dd></div><div><dt>所在地区</dt><dd>${escapeHtml(company.address.split("市")[0] + "市")}</dd></div><div><dt>税务登记地址</dt><dd>${escapeHtml(tax.address || "-")}</dd></div>
      <div><dt>税务登记联系电话</dt><dd>${escapeHtml(tax.phone || "-")}</dd></div><div><dt>税务登记开户行</dt><dd>${escapeHtml(tax.bank || "-")}</dd></div><div><dt>税务登记银行账号</dt><dd>${escapeHtml(tax.bankAccount || "-")}</dd></div><div><dt>纳税人类型</dt><dd>${tax.taxpayerType === "general" ? "一般纳税人" : "小规模纳税人"}</dd></div>
      <div><dt>计税方式</dt><dd>${tax.taxMethod === "general" ? "一般计税" : "简易计税"}</dd></div><div><dt>征收率</dt><dd>${escapeHtml(tax.taxMethod === "simple" ? tax.rate || "-" : "-")}</dd></div>
    </dl>
    <div class="section-divider"></div>
    <div class="section-heading"><div><h2>开票模式</h2></div></div>
    <div class="mode-list">${["rpa", "joint", "self"].map((key) => renderModeCard(company, key)).join("")}</div>
  </div>`;
}

function renderModeCard(company, key) {
  const mode = company.modes[key] || { status: "pending" };
  const meta = MODE_META[key];
  const status = modeStatus(mode);
  const isCurrent = company.currentMode === key;
  let action = "";
  if (mode.status === "pending") {
    const disabled = key === "self" && !company.selfUseConfigured;
    action = `<button class="button ${disabled ? "" : "primary"}" type="button" data-action="open-mode" data-mode="${key}" ${disabled ? "disabled" : ""}>开通</button>`;
  } else if (mode.status === "opening") {
    action = key === "joint" ? "" : `<button class="button border" type="button" data-action="refresh-mode" data-mode="${key}">刷新状态</button>`;
  } else if (mode.status === "success" && isCurrent) {
    action = `<button class="button" type="button" disabled>当前使用</button>`;
  } else if (mode.status === "success") {
    action = `<button class="button primary" type="button" data-action="switch-mode" data-mode="${key}">切换使用</button>`;
  } else if (key === "rpa") {
    action = `<button class="button primary" type="button" data-action="resubmit-rpa">重新提交</button>`;
  } else {
    action = `<button class="button border" type="button" data-action="view-mode-progress" data-mode="${key}">查看原因</button>`;
  }
  const linkedApplication = handlingApplications.find((item) => item.targetId === company.id && item.customerNo === company.customerNo && item.mode === key);
  if (linkedApplication && !TERMINAL_APPLICATION_STATUSES.has(linkedApplication.status)) action = `<button class="button border" data-action="view-application" data-id="${linkedApplication.id}">查看办理申请</button>`;
  let detail = "";
  if (key === "rpa" && (mode.accounts?.length || mode.status === "opening" || mode.status === "failed")) detail = renderRpaAccounts(mode.accounts || [], mode.status, mode.failureReason || "");
  if (key === "joint" && mode.records?.length) detail = renderJointRecords(company, mode);
  if (key === "self" && mode.status === "pending" && !company.selfUseConfigured) detail = `<div class="mode-detail"><div class="notice warning"><span>所属客户尚未完成乐企自用配置，当前不可开通。</span></div></div>`;
  if (key === "self" && mode.status === "opening") detail = '<div class="mode-detail"><div class="notice"><span>乐企自用开通正在处理，完成后可切换为当前使用模式。</span></div></div>';
  return `<article class="mode-card ${isCurrent ? "current" : ""}">
    <div class="mode-card-head"><div class="mode-icon">${meta.icon}</div><div class="mode-title"><div class="mode-title-line"><h3>${meta.label}</h3>${isCurrent ? '<span class="tag blue">当前使用</span>' : ""}</div><p>服务渠道：${key === "rpa" ? escapeHtml(rpaChannelLabel(mode.channel)) : meta.channel}</p></div><div>${statusMarkup(mode.status, status.label)}</div><div class="mode-actions">${action}</div></div>${detail}
  </article>`;
}

function renderRpaAccounts(accounts, status = "success", failureReason = "") {
  const rows = accounts
    .map((item) => `<tr><td>${escapeHtml(item.name)}</td><td>${escapeHtml(item.taxAccount)}</td><td>${escapeHtml(item.email)}</td><td>${escapeHtml(item.role)}</td><td>${escapeHtml(item.loginMode)}</td><td>${escapeHtml(item.loginAccount)}</td><td>${escapeHtml(item.updatedAt)}</td></tr>`)
    .join("");
  const progress = status === "opening"
    ? '<div class="notice" style="margin-bottom:16px"><span>RPA 开通申请已提交，运营人员将联系客户完成税局登录验证及后续操作。</span></div>'
    : status === "failed"
      ? `<div class="notice error" style="margin-bottom:16px"><span>${escapeHtml(failureReason || "运营人员已驳回本次开通申请，请重新提交。")}</span></div>`
      : "";
  return `<div class="mode-detail">${progress}<div class="mode-detail-head"><h4>开票人税局账户信息</h4></div><div class="table-scroll"><table class="data-table"><thead><tr><th>开票人姓名</th><th>税局账号</th><th>联系邮箱</th><th>税局角色</th><th>登录模式</th><th>登录账号</th><th>更新时间</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function channelStatusLabel(status) {
  return { pending: "待授权", opening: "开通中", failed: "已驳回待重试", success: "开通成功" }[status] || "-";
}

function channelStatusKey(status) {
  return { pending: "pending", opening: "opening", failed: "failed", success: "success" }[status] || "pending";
}

function renderJointRecords(company, mode) {
  const rows = mode.records
    .map((record) => {
      const isDefault = record.wxMerchantNo === mode.defaultWxMerchantNo;
      const allAbilities = Object.keys(ABILITY_LABELS);
      const remainingAbilities = allAbilities.filter((ability) => !record.abilities.includes(ability) && !(record.pendingAbilities || []).includes(ability));
      const actions = [];
      if (record.status === "success" && record.channelStatus === "success" && !isDefault) actions.push(`<button class="button link" type="button" data-action="set-default" data-record="${record.id}">设为默认</button>`);
      if (record.status === "success" && record.channelStatus === "success" && remainingAbilities.length) actions.push(`<button class="button link" type="button" data-action="add-ability" data-record="${record.id}">增加开通能力</button>`);
      if (record.channelStatus !== "success") {
        actions.push(`<button class="button link" type="button" data-action="view-record-qr" data-record="${record.id}">查看二维码</button>`);
        actions.push(`<button class="button link" type="button" data-action="refresh-record" data-record="${record.id}">刷新状态</button>`);
      }
      return `<tr><td><strong>${escapeHtml(record.wxMerchantNo)}</strong>${isDefault ? '<span class="tag blue" style="margin-left:8px">默认</span>' : ""}</td><td>${abilityTags(record.abilities, record.pendingAbilities || [])}</td><td>${statusMarkup(channelStatusKey(record.channelStatus), channelStatusLabel(record.channelStatus))}${record.errorReason ? `<br /><span class="muted" title="${escapeHtml(record.errorReason)}">${escapeHtml(record.errorReason)}</span>` : ""}</td><td><div class="row-actions">${actions.length ? actions.join("") : '<span class="muted">-</span>'}</div></td></tr>`;
    })
    .join("");
  return `<div class="mode-detail"><div class="mode-detail-head"><h4>微信商户号开通记录</h4><button class="button border" type="button" data-action="add-wx">新增微信商户号</button></div><div class="table-scroll"><table class="data-table" style="min-width:780px"><thead><tr><th>微信商户号</th><th>开通能力</th><th>腾讯渠道状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function renderMalaysiaInvoice(company) {
  if (company.openStatus !== "success") {
    return `<div class="invoice-empty"><div class="empty-icon">MY</div><h2>尚未开通电子发票</h2><button class="button primary" type="button" data-action="start-opening">开通</button></div>`;
  }
  return `<div>
    <div class="invoice-summary-card"><div><h2>${escapeHtml(company.name)}</h2><div class="summary-line"><span>TIN：${escapeHtml(company.licenses.TIN)}</span><span>${availabilityMarkup(company)}</span></div></div><div class="invoice-summary-action"><span>${company.enabled ? "开票功能已启用" : "开票功能已禁用"}</span><button class="switch" type="button" role="switch" aria-label="开票功能状态" aria-checked="${company.enabled}" data-action="toggle-invoice"></button></div></div>
    <div class="section-divider"></div>
    <div class="section-heading"><div><h2>基本信息</h2></div><button class="button border" type="button" data-action="edit-my-tax">编辑</button></div>
    <dl class="info-grid"><div><dt>公司名称</dt><dd>${escapeHtml(company.name)}</dd></div><div><dt>商业注册号码（BRN）</dt><dd>${escapeHtml(company.registrationNo)}</dd></div><div><dt>税务识别号码（TIN）</dt><dd>${escapeHtml(company.licenses.TIN)}</dd></div><div><dt>销售与服务税注册号码（SST）</dt><dd>${escapeHtml(company.licenses.SST)}</dd></div></dl>
  </div>`;
}

function startOpening(company, presetMode = "", lockPrefix = false, returnContext = state.view === "detail" ? "company-detail" : state.view === "taxpayer-detail" ? "taxpayer-detail" : state.view === "invoice-business" ? "invoice-business" : "workbench", applicationId = "") {
  if (!company) return;
  if (company.country === "CN" && presetMode && blockDuplicateApplication(company, taxMatterId(presetMode), applicationId)) return;
  if (company.country === "CN" && !company.customerProductOpen) { showToast("所属客户尚未开通电子发票产品"); return; }
  if (presetMode === "self" && !company.selfUseConfigured) { showToast("所属客户尚未完成乐企自用配置"); return; }
  if (returnContext === "matter-target" && !matterAllowsNewRequest(taxMatterId(presetMode), company.modes[presetMode]?.status === "success")) { showToast("该开票能力已开通，无需重复办理"); return; }
  if (company.country === "CN" && presetMode && company.modes[presetMode]?.status === "success" && presetMode !== "joint") { showToast("该模式已开通，无需重复办理"); return; }
  state.companyId = company.id;
  state.result = null;
  if (company.country === "MY") {
    state.opening = {
      kind: "my",
      returnContext,
      tin: company.licenses.TIN || "",
      sst: company.licenses.SST || "",
      errors: {},
    };
    state.view = "opening-my";
  } else {
    const additional = Boolean(presetMode) || lockPrefix;
    state.opening = {
      applicationId,
      kind: additional ? "additional" : "initial",
      returnContext,
      step: applicationId ? 3 : presetMode ? 2 : 1,
      fixedMode: presetMode,
      mode: presetMode,
      hasExistingTaxpayer: company.openStatus !== "pending",
      tax: clone(company.tax),
      rpa: { channel: "qixiang", name: "", mobile: "", password: "", role: "办税员", email: "" },
      joint: { merchantId: "", manualMerchantId: "", wxMerchantNo: "", abilities: [] },
      selfVerified: false,
      selfAccessConfirmed: false,
      selfQueryStatus: "idle",
      errors: {},
    };
    state.view = "opening-cn";
  }
  render();
  scrollMain({ top: 0 });
}

function renderSteps(current, additional = false, fixedMode = "") {
  const steps = ["选择开票模式", "确认纳税人信息", "填写开通信息", "确认提交"];
  return `<div class="steps">${(fixedMode ? steps.slice(1) : steps)
    .map((title, index) => {
      const step = index + (fixedMode ? 2 : 1);
      const className = step < current ? "finish" : step === current ? "process" : "";
      const visual = step < current ? "✓" : index + 1;
      const disabledNote = additional && !fixedMode && step < 3 ? "（已完成）" : "";
      return `${index ? `<span class="step-line ${step <= current ? "finish" : ""}"></span>` : ""}<span class="step-item ${className}" ${step === current ? 'aria-current="step"' : ""}><span class="step-circle">${visual}</span><span>${title}${disabledNote}</span></span>`;
    })
    .join("")}</div>`;
}

function renderChinaOpening() {
  const company = currentCompany();
  const opening = state.opening;
  if (!company || !opening) {
    state.view = "business-opening";
    state.workbenchSection = "matters";
    state.businessDomain = "invoice";
    render();
    return;
  }
  const breadcrumbItems = opening.returnContext === "application-detail"
    ? [{ label: "业务办理工作台", action: "back-business-opening" }, { label: "申请详情", action: "cancel-opening" }, { label: opening.applicationId ? "补充申请资料" : "重新发起申请" }]
    : opening.returnContext === "company-detail"
    ? [{ label: "我的客户", action: "back-customers" }, { label: "公司详情", action: "back-company-invoice" }, { label: opening.mode ? taxMatterName(opening.mode) : "选择公司开票能力" }]
    : opening.returnContext === "matter-target"
      ? [{ label: "业务办理工作台", action: "back-business-opening" }, { label: "选择办理公司", action: "back-matter-target" }, { label: taxMatterName(opening.mode) }]
      : [{ label: "电子发票", action: "back-invoice-business" }, { label: opening.mode ? taxMatterName(opening.mode) : "选择公司开票能力" }];
  app.innerHTML = `
    ${breadcrumb(breadcrumbItems)}
    ${companySummary(company, false)}
    <section class="panel"><div class="steps-wrap">${renderSteps(opening.step, opening.kind === "additional", opening.fixedMode)}</div><div class="flow-body">${renderChinaStep(company, opening)}</div></section>`;
}

function renderChinaStep(company, opening) {
  if (opening.step === 1) return renderModeSelection(company, opening);
  if (opening.step === 2) return renderTaxForm(company, opening);
  if (opening.step === 3) return renderModeForm(company, opening);
  if (opening.step === 4) return renderChinaReview(company, opening);
  return renderModeSelection(company, opening);
}

function renderTaxForm(company, opening) {
  const tax = opening.tax;
  if (opening.hasExistingTaxpayer) {
    return `<div class="flow-section"><div class="section-heading"><div><h2>确认纳税人信息</h2></div></div>
      <dl class="review-grid taxpayer-confirm-grid"><div><dt>所属客户</dt><dd>${escapeHtml(company.customer)}（${escapeHtml(company.customerNo)}）</dd></div><div><dt>纳税人名称</dt><dd>${escapeHtml(company.name)}</dd></div><div><dt>统一社会信用代码</dt><dd>${escapeHtml(company.registrationNo)}</dd></div><div><dt>纳税人类型</dt><dd>${tax.taxpayerType === "general" ? "一般纳税人" : "小规模纳税人"}</dd></div><div><dt>计税方式</dt><dd>${tax.taxMethod === "general" ? "一般计税" : "简易计税"}</dd></div><div><dt>征收率</dt><dd>${escapeHtml(tax.taxMethod === "simple" ? tax.rate || "-" : "-")}</dd></div><div><dt>地址</dt><dd>${escapeHtml(tax.address || "-")}</dd></div><div><dt>电话</dt><dd>${escapeHtml(tax.phone || "-")}</dd></div><div><dt>开户行</dt><dd>${escapeHtml(tax.bank || "-")}</dd></div><div><dt>开户行账号</dt><dd>${escapeHtml(tax.bankAccount || "-")}</dd></div></dl>
      <div class="flow-actions"><button class="button border" type="button" data-action="${opening.fixedMode ? "cancel-opening" : "prev-opening"}">${opening.fixedMode ? "返回" : "上一步"}</button><button class="button primary" type="button" data-action="next-opening">下一步</button></div></div>`;
  }
  const smallTaxpayer = tax.taxpayerType === "small";
  if (smallTaxpayer) tax.taxMethod = "simple";
  return `<div class="flow-section"><div class="section-heading"><div><h2>填写纳税人信息</h2></div></div>
    <div class="form-grid">
      <label class="field required"><span>纳税人类型</span><select class="semi-select" id="taxpayerType"><option value="general" ${tax.taxpayerType === "general" ? "selected" : ""}>一般纳税人</option><option value="small" ${tax.taxpayerType === "small" ? "selected" : ""}>小规模纳税人</option></select></label>
      <label class="field required"><span>计税方式</span><select class="semi-select" id="taxMethod" ${smallTaxpayer ? "disabled" : ""}><option value="general" ${tax.taxMethod === "general" ? "selected" : ""}>一般计税</option><option value="simple" ${tax.taxMethod === "simple" ? "selected" : ""}>简易计税</option></select></label>
      <label class="field ${tax.taxMethod === "simple" ? "required" : ""}"><span>征收率</span><select class="semi-select" id="taxRate" ${tax.taxMethod === "general" ? "disabled" : ""}><option value="">请选择</option><option value="1%" ${tax.rate === "1%" ? "selected" : ""}>1%</option><option value="3%" ${tax.rate === "3%" ? "selected" : ""}>3%</option><option value="5%" ${tax.rate === "5%" ? "selected" : ""}>5%</option></select><small class="form-error">${escapeHtml(opening.errors.rate || "")}</small></label>
      <div></div>
      <div class="tax-secondary-grid span-2"><label class="field"><span>地址</span><input class="semi-input" id="taxAddress" value="${escapeHtml(tax.address)}" /></label><label class="field"><span>电话</span><input class="semi-input" id="taxPhone" value="${escapeHtml(tax.phone)}" /></label><label class="field"><span>开户行</span><input class="semi-input" id="taxBank" value="${escapeHtml(tax.bank)}" /></label><label class="field"><span>开户行账号</span><input class="semi-input" id="taxBankAccount" value="${escapeHtml(tax.bankAccount)}" /></label></div>
    </div>
    <div class="flow-actions"><button class="button border" type="button" data-action="${opening.fixedMode ? "cancel-opening" : "prev-opening"}">${opening.fixedMode ? "返回" : "上一步"}</button><button class="button primary" type="button" data-action="next-opening">下一步</button></div></div>`;
}

function renderModeSelection(company, opening) {
  return `<div class="flow-section"><div class="section-heading"><div><h2>选择开票模式</h2></div></div>
    <div class="selection-cards">
      ${modeSelectionCard("rpa", opening.mode, company)}
      ${modeSelectionCard("joint", opening.mode, company)}
      ${modeSelectionCard("self", opening.mode, company)}
    </div>
    ${opening.errors.mode ? `<div class="form-error" style="margin-top:12px">${escapeHtml(opening.errors.mode)}</div>` : ""}
    <div class="flow-actions"><button class="button border" type="button" data-action="cancel-opening">取消</button><button class="button primary" type="button" data-action="next-opening">下一步</button></div></div>`;
}

function modeSelectionCard(key, selected, company) {
  const status = company.modes?.[key]?.status || "pending";
  const missingSelfUseConfig = key === "self" && !company.selfUseConfigured;
  const selectable = !missingSelfUseConfig && ["pending", "failed"].includes(status);
  const colorClass = status === "failed" ? "red" : status === "opening" ? "blue" : status === "success" ? "green" : "";
  const statusLabel = missingSelfUseConfig ? "暂不可开通" : status === "pending" ? "可开通" : MODE_STATUS_META[status]?.label || "未开通";
  const note = missingSelfUseConfig
    ? "所属客户尚未完成乐企自用配置"
    : status === "success"
      ? "该客户下已开通，无需重复提交"
      : status === "opening"
        ? "该客户下已有申请正在处理"
        : status === "failed"
          ? "可选择后重新提交"
          : "";
  return `<button class="selection-card ${selected === key ? "selected" : ""}" type="button" data-action="select-mode" data-mode="${key}" ${selectable ? "" : "disabled"}><div class="selection-card-title"><h3>${MODE_META[key].label}</h3><span class="tag invoice-mode-tag ${colorClass}">${escapeHtml(statusLabel)}</span></div>${note ? `<p>${escapeHtml(note)}</p>` : ""}${selected === key ? '<span class="selected-mark">✓</span>' : ""}</button>`;
}

function selectedMerchant(company, opening) {
  return company.merchantCatalog.find((merchant) => merchant.id === opening.joint.merchantId);
}

function renderModeForm(company, opening) {
  const mode = opening.mode;
  let content = "";
  if (mode === "rpa") content = renderRpaForm(opening);
  else if (mode === "joint") content = renderJointForm(company, opening);
  else if (mode === "self") content = renderSelfUseForm(company, opening);
  else content = `<div class="notice error"><span>请选择需要开通的模式。</span></div>`;
  const nextDisabled = mode === "self" && !opening.selfVerified;
  const formTitle = mode === "rpa" ? "填写开票人信息" : `填写${modeLabel(mode)}开通信息`;
  return `<div class="flow-section">${mode === "rpa" ? renderRpaChannel(opening) : ""}<div class="section-heading"><div><h2>${escapeHtml(formTitle)}</h2></div></div>${content}
    <div class="flow-actions"><button class="button border" type="button" data-action="${opening.applicationId ? "cancel-opening" : "prev-opening"}">${opening.applicationId ? "取消" : "上一步"}</button><button class="button primary" type="button" data-action="next-opening" ${nextDisabled ? "disabled" : ""}>下一步</button></div></div>`;
}

function renderRpaChannel(opening) {
  const channel = opening.rpa.channel || "qixiang";
  return `<section class="rpa-channel-section"><div class="section-heading"><h2>选择开票通道</h2></div><div class="rpa-channel-options" role="group" aria-label="开票通道"><button type="button" class="rpa-channel-choice ${channel === "qixiang" ? "selected" : ""}" aria-pressed="${channel === "qixiang"}" data-action="rpa-channel-qixiang"><span aria-hidden="true" class="channel-choice-dot"></span>企享云</button><button type="button" class="rpa-channel-choice ${channel !== "qixiang" ? "selected" : ""}" aria-pressed="${channel !== "qixiang"}" data-action="rpa-channel-other"><span aria-hidden="true" class="channel-choice-dot"></span>其他${channel !== "qixiang" ? `<span class="rpa-channel-name">${escapeHtml(rpaChannelLabel(channel))}</span>` : ""}</button></div>${opening.errors.channel ? `<small class="form-error">${escapeHtml(opening.errors.channel)}</small>` : ""}</section>`;
}

function chooseOtherRpaChannel() {
  if (state.opening?.mode !== "rpa") return;
  captureRpaStep();

function matterNoticeContent(matter) {
  const prerequisites = [`选择需要办理的${matter.target}，核对名称和所属客户。`];
  const rules = ["同一客户、同一业务对象、同一事项有办理中的申请时，不能重复发起。"];
  if (matter.route === "tax-opening") {
    prerequisites.splice(0, prerequisites.length,
      "需先在客户下创建相应公司主档。",
      "所属客户需已开通电子发票产品。");
    const alreadyOpened = "对应业务或开票能力已开通时，不可重复开通。";
    if (matter.mode === "rpa") {
      prerequisites.push("准备税号对应的开票人信息，包含开票人姓名、税局登录手机号、税局密码和税局身份。");
      rules.push("提交后由运营人员联系客户完成税局登录验证；提交申请不代表开通成功。", alreadyOpened,
        "办理失败后，可在满足该事项办理条件时重新发起。");
    } else if (matter.mode === "joint") {
      prerequisites.push("需要有同主体的收钱吧商户，并且已完成微信升级认证。", "提前联系企业法定代表人或微信商户管理员完成扫码授权。");
      rules.push("每次申请仅办理一个微信商户号。", alreadyOpened);
    } else {
      prerequisites.push("所属客户须已完成乐企自用配置。", "公司主体须完成使用单位接入。");
      rules.push("使用单位信息检查通过后方可提交开通。", alreadyOpened);
    }
  } else if (matter.route === "payment") {
    prerequisites.push("核对办理公司信息，并确认本次进件机构。");
    rules.push("每次进件形成独立申请；成功后生成的商户与已有商户分别保留。", "提交申请后需等待机构处理结果，不代表商户已开通。");
  } else {
    const preparation = {
      "enterprise-account": "确认目标集团及本次企业账户开通信息。",
      "pos-payment-method": "确认目标品牌、本次需要配置的支付方式及调整内容。",
      "pos-payment-channel": "确认目标品牌及本次需要配置的支付渠道。",
      "checkout-setting": "确认目标品牌及本次需要调整的收银台设置。",
      "gift-card-setting": "确认目标品牌及本次需要调整的礼品卡规则。",
      "deposit-setting": "确认目标门店及本次需要调整的订金规则。",
    };
    prerequisites.push(preparation[matter.id]);
  }
  if (matter.route !== "tax-opening") {
    rules.push(matter.allowRepeatAfterSuccess
      ? matter.route === "payment" ? "办理成功后仍可再次发起，为同一公司创建新的商户。" : "办理成功后可再次发起配置，每次形成独立申请并保留历史记录。"
      : "对应业务或开票能力已开通时，不可重复开通。");
    rules.push("办理失败后，可在满足该事项办理条件时重新发起。");
  }
  const list = (items) => `<ul>${items.filter(Boolean).map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
  return `<div class="matter-notice"><div class="matter-notice-summary"><h3>${escapeHtml(matter.name)}</h3><p>${escapeHtml(matter.domain)} · ${escapeHtml(matter.target)}</p></div><section><h3>办理前准备</h3>${list(prerequisites)}</section><section><h3>办理规则</h3>${list(rules)}</section></div>`;
}

function renderModal() {
  const modal = state.modal;
  if (!modal) {
    modalRoot.innerHTML = "";
    return;
  }
  let title = modal.title || "提示";
  let body = "";
  let confirmText = "确认";
  let confirmAction = modal.confirmAction || "modal-confirm";
  let wide = false;
  if (modal.type === "reapply-check") {
    title = modal.checking ? "检查办理条件" : "暂不可重新发起";
    confirmText = "知道了"; confirmAction = "modal-close";
    body = modal.checking ? '<div class="reapply-checking" role="status" aria-live="polite"><span class="query-spinner" aria-hidden="true"></span><span>正在检查是否可重新发起，请稍候…</span></div>' : `<div class="notice error">${escapeHtml(modal.reason)}</div>`;
  } else if (modal.type === "rpa-other-channel") {
    title = "选择其他开票通道"; confirmText = "确认选择"; confirmAction = "confirm-rpa-channel"; wide = true;
    body = `<div class="notice warning rpa-channel-warning"><strong>如选择其他通道，请务必先与运营同事提前沟通确认。</strong></div><fieldset class="rpa-other-options"><legend>开票通道</legend><label class="radio-item"><input type="radio" name="otherRpaChannel" value="gaodeng" ${modal.channel === "gaodeng" ? "checked" : ""} />高灯云</label></fieldset><div class="form-error" id="otherRpaChannelError"></div>`;
  } else if (modal.type === "confirm") {
    body = `<p style="margin:0;color:#4e5969">${escapeHtml(modal.message)}</p>`;
  } else if (modal.type === "matter-notice") {
    const matter = MATTER_CATALOG.find((item) => item.id === modal.matterId);
    title = "办理须知"; confirmText = "开始办理"; confirmAction = "accept-matter-notice"; wide = true;
    body = matter ? matterNoticeContent(matter) : "未找到办理事项";

    const matter = MATTER_CATALOG.find(item => item.id === modal.matterId);

    const matter = MATTER_CATALOG.find((item) => item.id === modal.matterId);

    confirmText = "下一步";

    confirmAction = "save-tax";

    body = `<div class="form-grid"><label class="field required"><span>纳税人类型</span><select class="semi-select" id="editTaxpayerType"><option value="general" ${company.tax.taxpayerType === "general" ? "selected" : ""}>一般纳税人</option><option value="small" ${company.tax.taxpayerType === "small" ? "selected" : ""}>小规模纳税人</option></select></label><label class="field required"><span>计税方式</span><select class="semi-select" id="editTaxMethod"><option value="general" ${company.tax.taxMethod === "general" ? "selected" : ""}>一般计税</option><option value="simple" ${company.tax.taxMethod === "simple" ? "selected" : ""}>简易计税</option></select></label><label class="field"><span>征收率</span><select class="semi-select" id="editTaxRate"><option value="">不适用</option><option value="1%" ${company.tax.rate === "1%" ? "selected" : ""}>1%</option><option value="3%" ${company.tax.rate === "3%" ? "selected" : ""}>3%</option><option value="5%" ${company.tax.rate === "5%" ? "selected" : ""}>5%</option></select></label><label class="field"><span>地址</span><input class="semi-input" id="editTaxAddress" value="${escapeHtml(company.tax.address)}" /></label><label class="field"><span>电话</span><input class="semi-input" id="editTaxPhone" value="${escapeHtml(company.tax.phone)}" /></label><label class="field"><span>开户行</span><input class="semi-input" id="editTaxBank" value="${escapeHtml(company.tax.bank)}" /></label><label class="field span-2"><span>开户行账号</span><input class="semi-input" id="editTaxBankAccount" value="${escapeHtml(company.tax.bankAccount)}" /></label><div class="form-error span-2" id="editTaxError"></div></div>`;
  } else if (modal.type === "edit-my") {
    const company = currentCompany();
    title = "编辑马来西亚税务信息";
    confirmText = "保存";
    confirmAction = "save-my-tax";
    body = `<div class="form-grid" style="grid-template-columns:1fr"><label class="field required"><span>税务识别号码（TIN）</span><input class="semi-input" id="editMyTin" value="${escapeHtml(company.licenses.TIN)}" /></label><label class="field required"><span>销售与服务税注册号码（SST）</span><input class="semi-input" id="editMySst" value="${escapeHtml(company.licenses.SST)}" /></label><div class="form-error" id="editMyError"></div></div>`;
  } else if (modal.type === "add-ability") {
    const record = findJointRecord(modal.recordId);
    const remaining = Object.keys(ABILITY_LABELS).filter((ability) => !record.abilities.includes(ability) && !(record.pendingAbilities || []).includes(ability));
    title = "增加开通能力";
    confirmText = "提交开通";
    confirmAction = "confirm-add-ability";
    body = `<dl class="review-grid" style="margin-bottom:20px"><div><dt>微信商户号</dt><dd>${escapeHtml(record.wxMerchantNo)}</dd></div><div><dt>已开通能力</dt><dd>${record.abilities.map((ability) => ABILITY_LABELS[ability]).join("、")}</dd></div></dl><fieldset class="field" style="border:0;padding:0;margin:0"><legend class="field-label required">选择需要增加的能力</legend><div class="checkbox-group">${remaining.map((ability) => `<label class="checkbox-item"><input type="checkbox" name="additionalAbility" value="${ability}" />${ABILITY_LABELS[ability]}</label>`).join("")}</div><small class="form-error" id="addAbilityError"></small></fieldset>`;
  } else if (modal.type === "qr") {
    const record = findJointRecord(modal.recordId);
    title = "腾讯乐企授权";
    confirmText = "关闭";
    confirmAction = "modal-close";
    wide = true;
    body = renderQrCard(record);
  } else if (modal.type === "progress") {
    const company = currentCompany();
    const mode = company.modes[modal.mode];
    title = `${modeLabel(modal.mode)}开通进度`;
    confirmText = "关闭";
    confirmAction = "modal-close";
    body = renderModeProgressBody(modal.mode, mode);
  }
  const singleClose = modal.type === "reapply-check" || modal.type === "application-authorization" || modal.type === "progress" || modal.type === "qr" || modal.type === "payment-detail";
  modalRoot.innerHTML = `<div class="modal-mask" role="presentation"><section class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${escapeHtml(title)}</h2><button class="modal-close" type="button" data-action="modal-close" aria-label="关闭">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${modal.type === "reapply-check" && modal.checking ? '<button class="button border" type="button" data-action="modal-close">取消检查</button>' : `${singleClose ? "" : '<button class="button border" type="button" data-action="modal-close">取消</button>'}<button class="button primary" type="button" data-action="${confirmAction}">${confirmText}</button>`}</div></section></div>`;
}

function renderModeProgressBody(key, mode) {
  if (key === "rpa") return `<div class="notice"><span>RPA 开通申请正在由运营人员处理，销售端无需进行税局登录操作。</span></div>`;
  if (key === "self") return `<div class="notice"><span>乐企自用开通正在执行公司功能开通和模式设置。</span></div>`;
  const rows = (mode.records || []).filter((record) => record.status !== "success");
  if (!rows.length) return `<div class="notice success"><span>当前模式已开通成功。</span></div>`;
  return rows.map((record) => `<div class="notice ${record.channelStatus === "failed" ? "error" : ""}" style="margin-bottom:12px"><span>微信商户号 ${escapeHtml(record.wxMerchantNo)}：${escapeHtml(channelStatusLabel(record.channelStatus))}${record.errorReason ? `，${escapeHtml(record.errorReason)}` : ""}</span></div>`).join("");
}

function validateTaxStep() {
  const opening = state.opening;
  opening.errors = {};
  if (opening.tax.taxMethod === "simple" && !opening.tax.rate) opening.errors.rate = "请选择征收率";
  return !Object.keys(opening.errors).length;
}

function validateRpaStep() {
  const opening = state.opening;
  opening.errors = {};
  if (!RPA_CHANNELS[opening.rpa.channel || "qixiang"]) opening.errors.channel = "请选择开票通道";
  if (!opening.rpa.name) opening.errors.name = "请输入开票人姓名";
  if (!/^1\d{10}$/.test(opening.rpa.mobile)) opening.errors.mobile = "请输入有效的手机号";
  if (!opening.rpa.password) opening.errors.password = "请输入税局密码";
  if (opening.rpa.email && !/^\S+@\S+\.\S+$/.test(opening.rpa.email)) opening.errors.email = "请输入有效的邮箱";
  return !Object.keys(opening.errors).length;
}

function validateJointStep(company) {
  const opening = state.opening;
  opening.errors = {};
  const merchant = selectedMerchant(company, opening);
  if (!merchant) opening.errors.merchant = "请查询收钱吧商户";
  if (typeof opening.joint.wxMerchantNo !== "string" || !opening.joint.wxMerchantNo) opening.errors.wx = "请选择一个微信商户号";
  else if (merchant && !merchant.wxAccounts.some((wx) => wx.no === opening.joint.wxMerchantNo)) opening.errors.wx = "请选择当前收钱吧商户下的微信商户号";
  if (!opening.joint.abilities.length) opening.errors.abilities = "至少选择一项开票能力";
  return !Object.keys(opening.errors).length;
}

function nextOpening() {
  const company = currentCompany();
  const opening = state.opening;
  if (!company || !opening) return;
  if (opening.step === 1) {
    opening.errors = {};
    if (!opening.mode) {
      opening.errors.mode = "请选择开票模式";
      return render();
    }
    if (blockDuplicateApplication(company, taxMatterId(opening.mode))) return;
    opening.step = 2;
  } else if (opening.step === 2) {
    if (!opening.hasExistingTaxpayer) {
      captureTaxStep();
      if (!validateTaxStep()) return render();
    } else {
      opening.errors = {};
    }
    opening.step = 3;
  } else if (opening.step === 3) {
    let valid = false;
    if (opening.mode === "rpa") {
      captureRpaStep();
      valid = validateRpaStep();
    } else if (opening.mode === "joint") {
      captureJointStep();
      valid = validateJointStep(company);
    } else if (opening.mode === "self") {
      opening.errors = {};
      valid = opening.selfVerified;
      if (!valid) opening.errors.self = opening.selfAccessConfirmed ? "使用单位信息检查尚未完成，请稍候" : "请先确认已完成使用单位接入";
    }
    if (!valid) return render();
    opening.step = 4;
  }
  render();
  scrollMain({ top: 0, behavior: "smooth" });
}

function prevOpening() {
  if (!state.opening) return;
  state.opening.errors = {};
  const minimumStep = state.opening.applicationId ? 3 : state.opening.fixedMode ? 2 : 1;
  state.opening.step = Math.max(minimumStep, state.opening.step - 1);
  render();
}

function submitChinaOpening() {
  const company = currentCompany();
  const opening = state.opening;
  if (!company || !opening) return;
  if (opening.fixedMode && opening.mode !== opening.fixedMode) return;
  if (blockDuplicateApplication(company, taxMatterId(opening.mode), opening.applicationId)) return;
  if (opening.applicationId) {
    const existing = handlingApplications.find((item) => item.id === opening.applicationId);
    if (!existing || TERMINAL_APPLICATION_STATUSES.has(existing.status)) return;
  }
  if (opening.mode === "joint" && !validateJointStep(company)) {
    opening.step = 3;
    render();
    return;
  }
  const wasOpened = company.openStatus === "success";
  const createdRecordIds = [];
  company.tax = clone(opening.tax);
  if (opening.mode === "rpa") {
    company.modes.rpa = { status: "opening", channel: opening.rpa.channel || "qixiang", accounts: [rpaAccount(opening.rpa.name, opening.rpa.mobile)] };
    company.modes.rpa.accounts[0].email = opening.rpa.email || "-";
    company.modes.rpa.accounts[0].role = opening.rpa.role;
  } else if (opening.mode === "joint") {
    const merchant = selectedMerchant(company, opening);
    const record = wxRecord({
        id: `WX-NEW-${Date.now()}`,
        merchantId: merchant.id,
        merchantName: merchant.name,
        wxMerchantNo: opening.joint.wxMerchantNo,
        abilities: clone(opening.joint.abilities),
        status: "opening",
        channelStatus: "pending",
        updatedAt: "2026-08-26 16:30",
      });
      createdRecordIds.push(record.id);
      company.modes.joint.records.push(record);
    if (company.modes.joint.status !== "success") company.modes.joint.status = "opening";
  } else {
    company.modes.self = { status: "success" };
  }
  if (!wasOpened) {
    if (opening.mode === "self") {
      company.openStatus = "success";
      company.enabled = true;
      company.currentMode = "self";
    } else {
      company.openStatus = "opening";
      company.openingMode = opening.mode;
    }
  }
  const application = recordTaxApplication(company, opening, createdRecordIds);
  state.applicationId = application.id;
  state.applicationBatchReturnId = application.batchId || "";
  state.result = { applicationId: application.id, mode: opening.mode, recordIds: createdRecordIds, returnContext: opening.returnContext };
  state.opening = null;
  state.view = "application-detail";
  state.result = null;
  render();
  showToast(opening.mode === "self" ? "公司发票功能已开通" : "开通申请已提交");
}

function buildBatchCheckResults(batch) {
  const fileCompanies = batchOpeningCompanies();
  const customerNo = fileCompanies[0]?.customerNo || "";
  return fileCompanies.map((company, index) => {
    const sameCustomer = company.customerNo === customerNo;
    const payloadIssue = batchPayloadIssue(batch, company, index);
    const passed = sameCustomer && isModeOpenableForBatch(company, batch.mode) && !payloadIssue;
    const status = company.modes?.[batch.mode]?.status || "pending";
    let reason = "-";
    if (!sameCustomer) reason = "一个文件只能包含同一客户下的公司";
    else if (activeApplication(company, taxMatterId(batch.mode))) reason = `已有正在办理中的申请 ${activeApplication(company, taxMatterId(batch.mode)).id}，不能重复发起`;
    else if (!company.customerProductOpen) reason = "所属客户尚未开通电子发票产品";
    else if (batch.mode === "self" && !company.selfUseConfigured) reason = "所属客户尚未完成乐企自用配置";
    else if (status === "success") reason = "该模式已开通";
    else if (status === "opening") reason = "该模式已有申请正在处理";
    else if (payloadIssue) reason = payloadIssue;
    return { rowNumber: index + 1, companyId: company.id, passed, reason, applicationId: activeApplication(company, taxMatterId(batch.mode))?.id };
  });
}

function applyBatchOpening(batch) {
  const submitResults = [];
  batchOpeningCompanies().forEach((company, index) => {
    const checkResult = batch.checkResults.find((result) => result.rowNumber ? result.rowNumber === index + 1 : result.companyId === company.id);
    if (!checkResult?.passed) {
      submitResults.push({ companyId: company.id, label: "跳过", status: "skipped", reason: checkResult?.reason || "文件检查未通过", applicationId: checkResult?.applicationId });
      return;
    }
    const existing = activeApplication(company, taxMatterId(batch.mode));
    if (existing || !isModeOpenableForBatch(company, batch.mode) || batchPayloadIssue(batch, company, index)) {
      submitResults.push({ companyId: company.id, label: "跳过", status: "skipped", reason: existing ? `已有正在办理中的申请 ${existing.id}，不能重复发起` : "办理条件已变化，请重新检查", applicationId: existing?.id });
      return;
    }
    const companyBefore = clone(company);
    const applicationsBefore = handlingApplications.slice();
    try {
      const taxpayerExisted = company.openStatus !== "pending";
      const createdRecordIds = [];
      if (batch.mode === "rpa") {
        company.modes.rpa = { status: "opening", accounts: [rpaAccount(`批量开票人${index + 1}`, `1380000${String(index + 1).padStart(4, "0")}`)] };
      } else if (batch.mode === "joint") {
        const source = batch.sourceRows[index];
        const merchant = company.merchantCatalog.find((item) => item.id === source.merchantId);
        const wx = merchant.wxAccounts.find((item) => item.no === source.wxMerchantNo);
        const record = wxRecord({ id: `WX-BATCH-${Date.now()}-${index + 1}`, merchantId: merchant?.id || "-", merchantName: merchant?.name || "-", wxMerchantNo: wx?.no || "-", abilities: batchRequestedAbilities(source), status: "opening", channelStatus: "pending", updatedAt: applicationTime() });
        createdRecordIds.push(record.id);
        company.modes.joint = { status: "opening", defaultWxMerchantNo: company.modes.joint?.defaultWxMerchantNo || "", records: [...(company.modes.joint?.records || []), record] };
      } else {
        company.modes.self = { status: "success" };
      }
      if (!taxpayerExisted) {
        if (batch.mode === "self") {
          company.openStatus = "success";
          company.enabled = true;
          company.currentMode = "self";
        } else {
          company.openStatus = "opening";
          company.openingMode = batch.mode;
        }
      } else if (!company.currentMode && batch.mode === "self") {
        company.openStatus = "success";
        company.enabled = true;
        company.currentMode = "self";
      }
      const application = recordTaxApplication(company, { mode: batch.mode, scope: "批量模式开通" }, createdRecordIds);
      if (!application?.id) throw new Error("application-not-created");
      submitResults.push({ companyId: company.id, applicationId: application.id, label: "创建成功", status: "success", reason: "已创建办理申请" });
    } catch {
      for (const key of Object.keys(company)) if (!Object.hasOwn(companyBefore, key)) delete company[key];
      Object.assign(company, companyBefore);
      handlingApplications = applicationsBefore;
      submitResults.push({ companyId: company.id, label: "创建失败", status: "failed", reason: "办理申请未创建成功，请重新发起批量导入" });
    }
  });
  return submitResults;
}

    return;
  }
  if (action === "add-ability") {
    if (blockDuplicateApplication(currentCompany(), taxMatterId("joint"))) return;
    state.modal = { type: "add-ability", recordId: target.dataset.record };
    renderModal();
    return;
  }
  if (action === "view-record-qr") {
    state.modal = { type: "qr", recordId: target.dataset.record };
    renderModal();
    return;
  }
  if (action === "refresh-record") {
    showToast("已刷新腾讯渠道状态");
    return;
  }
  if (action === "refresh-mode") {
    showToast("已刷新开通状态");
    return;
  }
  if (action === "view-mode-progress") {
    state.modal = { type: "progress", mode: target.dataset.mode };
    renderModal();
    return;
  }
  if (action === "edit-tax") {
    state.modal = { type: "edit-tax" };
    renderModal();
    return;
  }
  if (action === "edit-my-tax") {
    state.modal = { type: "edit-my" };
    renderModal();
    return;
  }
  if (action === "refresh-progress") {
    showToast("已刷新腾讯渠道状态");
    return;
  }
  if (action === "copy-link") {
    const link = target.dataset.link;
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(link).catch(() => {});
    showToast("授权链接已复制");
    return;
  }
  if (action === "contact-ops") {
    showToast("已记录运营协助请求");
  }
});

  const action = target.dataset.action;
  if (action === "modal-close") {
    state.modal = null;
    renderModal();

    if (state.modal?.type !== "rpa-other-channel" || state.opening?.mode !== "rpa") return;

    if (channel !== "gaodeng") { document.getElementById("otherRpaChannelError").textContent = "请选择开票通道"; return; }
    state.opening.rpa.channel = channel;
    state.modal = null; render();

    if (state.modal?.type !== "matter-notice") return;
    const matter = MATTER_CATALOG.find((item) => item.id === state.modal.matterId);
    if (matter?.supportsBatch) { state.modal = { type: "submission-method", matterId: matter.id }; renderModal(); }
    else if (matter) beginMatter(matter);
  } else if (action === "confirm-submission-method") {
    if (state.modal?.type !== "submission-method") return;
    const matter = MATTER_CATALOG.find(item => item.id === state.modal.matterId);
    if (!matter?.supportsBatch) return;
    const method = document.querySelector('input[name="submissionMethod"]:checked')?.value;
    if (method === "batch") startBatchOpening(matter.mode);
    else if (method === "single") beginMatter(matter);
  } else if (action === "continue-matter") {
    const matter = MATTER_CATALOG.find((item) => item.id === state.modal?.matterId);
    const selectedTarget = document.getElementById("matterTarget")?.value || "";
    const error = document.getElementById("matterStarterError");
    if (!selectedTarget) {
      if (error) error.textContent = `请选择客户及${matter?.target || "办理对象"}`;
      return;
    }
    state.modal = null;
    renderModal();
    showToast(`已进入${matter?.name || "事项"}办理`);
  } else if (action === "submit-payment-onboarding") {
    const companyId = document.getElementById("paymentCompany")?.value || "";
    const institution = document.getElementById("paymentTargetInstitution")?.value || "";
    const returnView = state.modal?.returnView || "workbench";
    const error = document.getElementById("paymentOnboardingError");
    if (!companyId || !institution) {
      error.textContent = "请选择公司和进件机构";
      return;
    }
    const company = companies.find((item) => item.id === companyId);
    if (blockDuplicateApplication(company, `payment-${institution}`)) return;
    if (!matterAllowsNewRequest(`payment-${institution}`, paymentApplications.some((item) => item.companyId === companyId && item.institution === institution && item.status === "success"))) { error.textContent = "该公司已完成该机构商户进件，无需重复办理"; return; }
    const payment = { id: `PAY-${Date.now()}`, companyId, institution, merchantNo: "-", status: "opening", reason: "-", updatedAt: applicationTime() };
    paymentApplications.unshift(payment);
    const application = createPaymentApplication(company, payment);
    state.modal = null;
    state.view = returnView === "payment-business" ? "payment-business" : "business-opening";
    state.workbenchSection = returnView === "payment-business" ? state.workbenchSection : "records";
    state.businessDomain = "";
    state.paymentSection = "applications";
    state.paymentFilters = { keyword: "", institution: "", status: "opening" };
    render();
    showApplication(application.id);
    showToast(`已提交${PAYMENT_INSTITUTION_META[institution]}商户进件`);
  } else if (action === "modal-confirm") {
    confirmModalAction();
  } else if (action === "save-tax") {
    saveTaxEdit();
  } else if (action === "save-my-tax") {
    saveMalaysiaTaxEdit();
  } else if (action === "confirm-add-ability") {
    submitAdditionalAbility();
  } else if (action === "copy-link") {
    const link = target.dataset.link;
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(link).catch(() => {});
    showToast("授权链接已复制");
  } else if (["switch-mode", "toggle-invoice", "set-default"].includes(action)) {
    confirmModalAction();
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && state.modal) {
    state.modal = null;
    renderModal();
  }
});

seedHandlingApplications();
initCrmUi();
render();
</script>
</body>
</html>
