<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>公司发票功能开通 Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="platform-brand" aria-label="收钱吧掌柜">
        <span class="brand-mark" aria-hidden="true">收</span>
        <span class="platform-title">收钱吧掌柜</span>
      </div>
      <div class="top-account">
        <button class="icon-button" type="button" aria-label="消息">◔</button>
        <button class="icon-button" type="button" aria-label="通知">♧</button>
        <span class="avatar" aria-hidden="true">刘</span>
        <span>刘辰浩</span>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" aria-label="销售端导航">
        <button class="side-parent" type="button">数据报表</button>
        <button class="side-parent" type="button">客户管理</button>
        <div class="side-group">
          <button class="side-parent active-parent" type="button">G　集团客户</button>
          <button class="side-child active" type="button" data-action="go-customers">我的客户</button>
          <button class="side-child" type="button">品牌管理</button>
          <button class="side-child" type="button">批量操作记录</button>
        </div>
      </aside>

      <main class="main" id="app" tabindex="-1"></main>
    </div>

    <div id="modalRoot"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
